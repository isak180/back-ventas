version: "3.9"

services:
  db-ventas:
    image: mysql:8.0
    container_name: ventas-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ventas_db}
      MYSQL_USER: ${MYSQL_USER:-appuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-apppassword}
    ports:
      - "3307:3306"
    volumes:
      - ventas-db-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - ventas-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  backend-ventas:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-ventas
    image: backend-ventas:latest
    ports:
      - "8081:8081"
    environment:
      DB_HOST: db-ventas
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-ventas_db}
      DB_USER: ${MYSQL_USER:-appuser}
      DB_PASS: ${MYSQL_PASSWORD:-apppassword}
      SERVER_PORT: 8081
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
    depends_on:
      db-ventas:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ventas-net

volumes:
  ventas-db-data:
    driver: local

networks:
  ventas-net:
    driver: bridge
