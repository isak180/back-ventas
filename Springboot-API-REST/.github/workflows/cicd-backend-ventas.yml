name: CI/CD Backend - Ventas

on:
  push:
    branches:
      - deploy

jobs:
  build-push-deploy:
    name: Build, Push y Deploy Backend Ventas
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y Push imagen a ECR
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          ECR_REPO: ${{ secrets.ECR_REPO_BACKEND_VENTAS }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPO:latest
          docker push $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPO:latest
          echo "IMAGE=$ECR_REGISTRY/$ECR_REPO:latest" >> $GITHUB_ENV

      - name: Deploy en EC2 Backend Ventas (via SSM)
        uses: aws-actions/aws-ssm-send-command@v1
        with:
          instance-ids: ${{ secrets.EC2_BACKEND_INSTANCE_ID }}
          comment: "Deploy backend ventas"
          document-name: "AWS-RunShellScript"
          parameters: |
            {
              "commands": [
                "aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}",
                "docker pull ${{ env.IMAGE }}",
                "docker stop backend-ventas || true",
                "docker rm backend-ventas || true",
                "docker run -d --name backend-ventas --restart unless-stopped -p 8081:8081 -e DB_HOST=${{ secrets.DB_HOST }} -e DB_PORT=3306 -e DB_NAME=${{ secrets.DB_NAME_VENTAS }} -e DB_USER=${{ secrets.DB_USER }} -e DB_PASS=${{ secrets.DB_PASS }} -e CORS_ALLOWED_ORIGINS=${{ secrets.FRONTEND_URL }} ${{ env.IMAGE }}"
              ]
            }
